name: Docker Swarm Deployment Action
description: Deploy your Docker Swarm apps in seconds. 🚀
author: Matchory GmbH

branding:
  icon: zap
  color: blue

inputs:
  stack-name:
    description: >-
      Name of the stack to deploy. Defaults to the repository name.
  version:
    description: >-
      Version for the deployment. Defaults to the tag name being built, or the
      short commit hash.
  compose-file:
    description: |-
      Path to the Docker Compose file(s) to use for deployment relative to the repository root. Separate multiple files
      with colons (`:`). If omitted, the action will look for any of the following file variants, in order:
       - `compose.production.yaml`
       - `compose.production.yml`
       - `compose.prod.yaml`
       - `compose.prod.yml`
       - `compose.yaml`
       - `compose.yml`
       - `docker-compose.production.yaml`
       - `docker-compose.production.yml`
       - `docker-compose.prod.yaml`
       - `docker-compose.prod.yml`
       - `docker-compose.yaml`
       - `docker-compose.yml`
       - `.docker/compose.yaml`
       - `.docker/compose.yml`
       - `.docker/docker-compose.yaml`
       - `.docker/docker-compose.yml`
       - `docker/compose.yaml`
       - `docker/compose.yml`
       - `docker/docker-compose.yaml`
       - `docker/docker-compose.yml`
  variables:
    description: >-
      Variables to pass to the deployment as a list of key-value pairs in the
      format `KEY=value`, separated by newlines, or as JSON object (e.g., from
      `toJSON(vars)`). Variables override those in the process 
      environment and can be used to pass through secrets or configs.
    default: ""
  secrets:
    description: >-
      Variables to pass to the deployment as a list of key-value pairs in the
      format `KEY=value`, separated by newlines, or as JSON object (e.g., from
      `toJSON(secrets)`). Secrets have higher priority than variables and
      override those in the process environment.
    default: ""
  exclude-variables:
    description: >-
      List of variable names to exclude from the final deployment, separated by
      newlines. Applies to variables from environment, variables, and secrets 
      sources. Does not affect extra-variables which have highest priority.
    default: ""
  extra-variables:
    description: >-
      Additional variables to pass to the deployment as a list of key-value 
      pairs in the format `KEY=value`, separated by newlines, or as JSON 
      object. These have the highest priority and override all other variable
      sources.
    default: ""
  env-var-prefix:
    description: >-
      Prefix of the variable names tried when a secret or config has no
      source, e.g. `DEPLOYMENT_APP_URL` for `app_url`. Defaults to
      `DEPLOYMENT`. Can also be set in the Compose file.
  manage-variables:
    description: >-
      Whether to automatically manage configs and secrets. If set to `false`,
      the action will leave the configs and secrets in the stack untouched.
      Defaults to `true`. Can also be set in the Compose file.
  strict-variables:
    description: >-
      Whether to fail if the `file` source of a secret or config cannot be
      read, instead of falling back to automatic resolution (a `<name>.secret`
      file or a matching environment variable). Undefined variables in the
      Compose Specification are replaced with an empty string and logged as a
      warning either way. Defaults to `true`. Can also be set in the Compose
      file.
  strict-compatibility:
    description: >-
      Whether to fail the deployment when the Compose Specification contains
      features that Docker Swarm does not support and cannot be translated
      (e.g. develop, profiles, provider). When false (the default), such
      features are stripped or translated with a warning instead of failing.
      Can also be set in the Compose file.
  key-interpolation:
    description: >-
      Whether to enable interpolation of environment variables within keys in
      the Compose Specification, in addition to values. This is not supported by
      the Compose Spec, and thus needs to be enabled explicitly. Defaults to
      `false`. Can also be set in the Compose file.
  profiles:
    description: >-
      Compose profiles to activate, separated by commas, spaces or newlines.
      Only services without a profile or with an active one are deployed; `*`
      activates every profile. If unset, every service is deployed regardless
      of its profiles. Can also be set in the Compose file.
  monitor:
    description: >-
      Whether to monitor the stack after the deployment is complete. If an error
      occurs, the action will fail. Defaults to `false`. Can also be set in
      the Compose file, and per service with a label.
  monitor-timeout:
    description: >-
      Timeout for post-deployment monitoring in seconds. Defaults to `300`.
      Can also be set in the Compose file, and per service with a label.
  monitor-interval:
    description: >-
      Interval for post-deployment monitoring checks in seconds. Defaults to
      `5`. Can also be set in the Compose file.
  health-check-warnings:
    description: >-
      Whether to emit warnings for missing or suspect health check
      configurations in compose services. Defaults to `true`. Can also be set
      in the Compose file, and per service with a label.
  destroy:
    description: >-
      Whether to remove the stack instead of deploying it, e.g. to tear down a
      preview environment. Removes the stack's services, networks, configs and
      secrets, but keeps its volumes. Requires `stack-name`. Only removes a
      stack this action deployed, and succeeds if the stack does not exist.
    default: "false"
  upload-compose-spec:
    description: >-
      Whether to upload the final interpolated Compose Specification as a
      workflow artifact after a successful deployment. The artifact may contain
      variable values and is readable by anyone with repository access. This
      governs the artifact only: the `compose-spec` output is written either
      way.
    default: "true"

outputs:
  status:
    description: "Deployment status"
  compose-spec:
    description: >-
      Docker Compose spec used for deployment. This is the interpolated spec, so
      it contains the resolved values of every variable it references, including
      any supplied through the `secrets` input. It is not redacted -- treat it as
      sensitive and do not write it anywhere the surrounding job would not put a
      secret. The uploaded artifact, by contrast, has `secrets` values redacted.
  stack-name:
    description: "Name of the stack deployed"
  version:
    description: "Version of the stack deployed"
  service-logs:
    description: "Logs of a failed service after deployment"

runs:
  using: node24
  main: dist/index.js
