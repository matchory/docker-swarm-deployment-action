version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    groups:
      # The @vitest/* packages pin vitest as an exact peer dependency, so
      # bumping either alone breaks `npm ci`. Listed first because Dependabot
      # assigns a dependency to the first group it matches.
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-production:
        dependency-type: production
        update-types:
          - patch
