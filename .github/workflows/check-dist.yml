# In TypeScript actions, `dist/` is committed and run directly. This workflow
# rebuilds it and fails if the committed `dist/` is out of sync with `src/`,
# preventing stale bundles from shipping.

name: Check dist/

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-dist:
    name: Check dist/
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Build dist/
        id: build
        run: npm run package

      - name: Compare Directories
        id: diff
        run: |
          # `git diff` ignores untracked files, so mark new files in dist/
          # as intended to be added; otherwise a newly generated, never
          # committed file would go unnoticed.
          git add --intent-to-add dist/
          if [ "$(git diff --ignore-space-at-eol --text dist/ | wc -l)" -gt 0 ]; then
            echo "Detected uncommitted changes after build. See diff below:"
            git diff --ignore-space-at-eol --text dist/
            exit 1
          fi

      # If dist/ was different from expected, upload the actual version as an
      # artifact so it can be inspected or used to update the committed copy.
      - name: Upload Artifact
        id: upload
        if: ${{ failure() && steps.diff.conclusion == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
