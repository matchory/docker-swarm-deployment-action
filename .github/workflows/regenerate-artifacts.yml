# Dependabot updates `package.json` and `package-lock.json`, but it cannot
# rebuild the artifacts derived from them: the committed `dist/` bundle, which
# vendors its dependencies, and the `.licenses/` cache. Both `Check dist/` and
# `Licensed` then fail on `main` until someone regenerates them by hand.
#
# This workflow does that automatically once a dependency change lands, and
# opens a pull request with the result.
#
# It deliberately runs on `main` rather than on the Dependabot pull request
# itself. Dependabot-triggered runs receive a read-only token, and the usual
# workaround, `pull_request_target`, would hand a writable token to a job that
# runs `npm ci` over dependency versions nobody has reviewed yet. Running after
# the merge keeps the writable token in the same trust context that `Check
# dist/` already builds in.
#
# Even so, `npm ci` runs install scripts from newly merged dependencies, so the
# job that does it never sees the GitHub App's private key. `build` prepares
# the commit as a JSON payload and hands it over as an artifact; `publish`
# runs none of the repository's code, refuses any path outside `dist/` and
# `.licenses/`, and only then mints the app token.

name: Regenerate Artifacts

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: read

# Two dependency merges in quick succession would otherwise race for the same
# branch. Queue instead of cancelling, so the later run sees the newer lockfile.
concurrency:
  group: regenerate-artifacts
  cancel-in-progress: false

jobs:
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.payload.outputs.changed }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: "false"

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Setup Ruby
        id: setup-ruby
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: ruby

      - name: Setup Licensed
        id: setup-licensed
        uses: licensee/setup-licensed@0d52e575b3258417672be0dff2f115d7db8771d8 # v1.3.2
        with:
          version: 4.x
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild dist/
        id: build
        run: npm run package

      - name: Update License Cache
        id: licensed-cache
        run: licensed cache

      # Check the regenerated cache here as well, so a broken cache never
      # reaches a pull request in the first place.
      - name: Verify Licenses
        id: licensed-status
        run: licensed status


      # `createCommitOnBranch` takes the file contents inline, base64-encoded.
      # NUL-separated so git does not quote unusual paths, which would make
      # `base64` fail inside the process substitution unnoticed and commit the
      # file empty.
      - name: Prepare Commit Payload
        id: payload
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/payload"
          git add --all dist .licenses

          if git diff --cached --quiet; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "Generated artifacts are already up to date."
            exit 0
          fi

          git diff --cached --name-only -z --no-renames --diff-filter=d |
            while IFS= read -r -d '' path; do
              jq --null-input --arg path "$path" \
                --rawfile contents <(base64 --wrap=0 "$path") \
                '{path: $path, contents: $contents}'
            done | jq --slurp . >"$RUNNER_TEMP/payload/additions.json"
          git diff --cached --name-only -z --no-renames --diff-filter=D |
            jq --raw-input --slurp 'split("\u0000") | map(select(. != "") | {path: .})' \
            >"$RUNNER_TEMP/payload/deletions.json"

          echo "changed=true" >>"$GITHUB_OUTPUT"

      - name: Upload Commit Payload
        id: upload
        if: ${{ steps.payload.outputs.changed == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: commit-payload
          path: ${{ runner.temp }}/payload
          retention-days: 1

  publish:
    name: Open Pull Request
    needs: build
    if: ${{ needs.build.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download Commit Payload
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: commit-payload
          path: ${{ runner.temp }}/payload

      # The payload comes from a job that ran unreviewed install scripts, so
      # it must not be able to touch anything but the generated artifacts,
      # such as the workflows themselves.
      - name: Check Commit Payload
        id: check
        working-directory: ${{ runner.temp }}/payload
        run: |
          outside=$(jq --raw-output --slurp \
            'add | map(.path)
              | map(select((test("^(dist|\\.licenses)/") | not)
                or test("(^|/)\\.\\.(/|$)")))
              | .[]' \
            additions.json deletions.json)

          if [ -n "$outside" ]; then
            echo "::error::Payload touches paths outside dist/ and .licenses/:"
            echo "$outside"
            exit 1
          fi

      # `GITHUB_TOKEN` cannot open pull requests: the org policy "Allow GitHub
      # Actions to create and approve pull requests" is off, so that a workflow
      # can never approve its own changes. Its pushes are also unsigned, which
      # the signed-commits ruleset rejects. Use a short-lived GitHub App token
      # for both instead, which also means the checks run on the pull request.
      # Needs the repository variable PR_BOT_CLIENT_ID and secret
      # PR_BOT_PRIVATE_KEY for an app with contents: write and
      # pull-requests: write on this repository.
      - name: Mint App Token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PR_BOT_CLIENT_ID }}
          private-key: ${{ secrets.PR_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open Pull Request
        id: pull-request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: chore/regenerate-artifacts
          HEAD: ${{ github.sha }}
          PAYLOAD: ${{ runner.temp }}/payload
        run: |
          # GitHub only signs commits an app creates through the API, not ones
          # it pushes, so the commit is built with `createCommitOnBranch`
          # rather than `git commit`. That mutation only appends to an
          # existing branch, so build the commit on a throwaway branch cut
          # from the commit `build` ran on, then move the real branch onto it
          # in one update. Resetting the real branch first would briefly leave
          # an open pull request with no changes, which GitHub closes.
          set -o pipefail
          repo="repos/$GITHUB_REPOSITORY/git"
          staging="$BRANCH-$GITHUB_RUN_ID"

          gh api "$repo/refs" \
            -f ref="refs/heads/$staging" -f sha="$HEAD" >/dev/null
          trap 'gh api --method DELETE "$repo/refs/heads/$staging" >/dev/null' EXIT

          jq --null-input \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "$staging" \
            --arg head "$HEAD" \
            --slurpfile additions "$PAYLOAD/additions.json" \
            --slurpfile deletions "$PAYLOAD/deletions.json" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repository, branchName: $branch},
                expectedHeadOid: $head,
                message: {headline: "chore: regenerate dist and license cache"},
                fileChanges: {additions: $additions[0], deletions: $deletions[0]}
              }}
            }' >"$RUNNER_TEMP/commit.json"
          commit=$(gh api graphql --input "$RUNNER_TEMP/commit.json" \
            --jq '.data.createCommitOnBranch.commit.oid')

          # `git/ref/` (singular) matches exactly; `git/refs/` would also
          # answer 200 for other branches that merely share this prefix.
          if gh api "$repo/ref/heads/$BRANCH" >/dev/null 2>&1; then
            gh api --method PATCH "$repo/refs/heads/$BRANCH" \
              -f sha="$commit" -F force=true >/dev/null
          else
            gh api "$repo/refs" \
              -f ref="refs/heads/$BRANCH" -f sha="$commit" >/dev/null
          fi

          open=$(gh pr list --head "$BRANCH" --state open --json number \
            --jq '.[].number')

          if [ -n "$open" ]; then
            echo "Updated existing pull request #$open."
            exit 0
          fi

          gh pr create --base main --head "$BRANCH" \
            --title "chore: regenerate dist and license cache" \
            --body "$(cat <<'BODY'
          `dist/` and `.licenses/` are derived from `package-lock.json`, and a
          dependency change landed on `main` without them. This pull request was
          opened automatically to bring them back in sync.

          `dist/` was rebuilt from a clean `npm ci`, so it reflects the current
          lockfile rather than a stale `node_modules`, and `licensed status`
          passed before this branch was updated.

          Close this pull request if the change is not wanted; it will be
          recreated the next time a dependency changes.
          BODY
          )"
